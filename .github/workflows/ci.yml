name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          # Variables factices suffisantes pour que le build passe en CI.
          # Les vraies valeurs de prod/preview restent dans Vercel, jamais ici.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}

  # Optionnel — à activer dès que tu commences à versionner des migrations SQL Supabase.
  # Vérifie que chaque migration s'applique proprement sur une DB Postgres jetable,
  # avant de merger, plutôt que de découvrir un problème en preview/prod.
  db-migrations:
    name: Vérifier les migrations Supabase
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vérifier la présence de migrations
        id: check-migrations
        run: |
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations 2>/dev/null)" ]; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          fi
 
      - name: Appliquer les migrations sur une DB jetable
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: >
          supabase db push --yes
          --db-url "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"
